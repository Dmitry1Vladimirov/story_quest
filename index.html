<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StoryQuest — истории скоро будут</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── кнопка справа сверху ── */
  .top-right {
    position: fixed;
    top: 24px;
    right: 28px;
    z-index: 10;
  }

  .archive-btn {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid #00ff88;
    color: #00ff88;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: lowercase;
    transition: all 0.25s ease;
    background: transparent;
  }

  .archive-btn:hover {
    background: #00ff88;
    color: #000;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
  }

  /* ── кнопка скачать лаунчер снизу ── */
  .bottom-center {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border: 1px solid #00ff88;
    color: #00ff88;
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: lowercase;
    transition: all 0.25s ease;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
  }

  .download-btn:hover {
    background: #00ff88;
    color: #000;
    box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
  }

  .download-btn .icon {
    font-size: 16px;
    line-height: 1;
  }

  .download-hint {
    margin-top: 12px;
    font-size: 11px;
    color: rgba(0, 255, 136, 0.4);
    letter-spacing: 1px;
  }

  /* ── центральный текст ── */
  .hero {
    text-align: center;
    padding: 20px;
  }

  .hero h1 {
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 300;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
  }

  /* мигающий курсор как в терминале */
  .cursor {
    display: inline-block;
    width: 0.6em;
    background: #00ff88;
    margin-left: 4px;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* сканлайны — лёгкий CRT-эффект */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 136, 0.03) 0px,
      rgba(0, 255, 136, 0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  /* мобильная адаптация */
  @media (max-width: 500px) {
    .bottom-center { bottom: 24px; width: 100%; padding: 0 20px; }
    .download-btn { padding: 12px 18px; font-size: 13px; width: 100%; justify-content: center; }
    .archive-btn { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

  <div class="top-right">
    <a href="archive.html" class="archive-btn">архив историй</a>
  </div>

  <div class="hero">
    <h1>истории скоро будут<span class="cursor">&nbsp;</span></h1>
  </div>

  <div class="bottom-center">
    <a href="downloads/StoryQuest.exe" class="download-btn" download>
      <span class="icon">⬇</span>
      <span>скачать лаунчер</span>
    </a>
    <div class="download-hint">windows • без установки</div>
  </div>

</body>
</html>
